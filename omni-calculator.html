<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniCalc — Scientific Calculator & Grapher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjs@14.2.1/lib/browser/math.min.js"></script>
  <style>
    :root {
      --bg1: #0b0e2a;
      --bg2: #26246b;
      --bg3: #131633;
      --glass: rgba(255,255,255,0.06);
      --glass-brd: rgba(255,255,255,0.13);
      --txt: #f2f4ff;
      --txt-dim: rgba(242,244,255,0.55);
      --accent: #7c5cff;
      --accent2: #00e5ff;
      --accent-glow: rgba(124,92,255,0.5);
      --key: rgba(255,255,255,0.08);
      --key-hi: rgba(255,255,255,0.18);
      --danger: #ff5c7c;
      --ok: #3ddc97;
      --eq-grad: linear-gradient(135deg, #7c5cff, #00e5ff);
      --disp-bg: rgba(0,0,0,0.28);
      --panel-bg: rgba(9,10,30,0.72);
      --ripple: rgba(255,255,255,0.4);
      --grid-line: rgba(255,255,255,0.07);
      --grid-axis: rgba(255,255,255,0.35);
    }

    body.light {
      --bg1: #dfe7ff;
      --bg2: #c9d6ff;
      --bg3: #efe9ff;
      --glass: rgba(255,255,255,0.62);
      --glass-brd: rgba(70,60,160,0.16);
      --txt: #1b1838;
      --txt-dim: rgba(27,24,56,0.6);
      --key: rgba(110,95,220,0.10);
      --key-hi: rgba(110,95,220,0.22);
      --disp-bg: rgba(255,255,255,0.5);
      --panel-bg: rgba(255,255,255,0.9);
      --ripple: rgba(124,92,255,0.35);
      --grid-line: rgba(30,30,80,0.10);
      --grid-axis: rgba(30,30,80,0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), var(--bg2));
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
      color: var(--txt);
      overflow-x: hidden;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: .45; pointer-events: none; z-index: 0;
      animation: floatOrb 22s ease-in-out infinite alternate;
    }
    .orb:nth-child(1) { width: 360px; height: 360px; background: #7c5cff; top: -100px; left: -100px; }
    .orb:nth-child(2) { width: 320px; height: 320px; background: #00e5ff; bottom: -90px; right: -80px; animation-delay: -8s; }
    .orb:nth-child(3) { width: 230px; height: 230px; background: #ff5c7c; top: 55%; left: 12%; opacity: .28; animation-delay: -14s; }
    @keyframes floatOrb {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(60px, -55px) scale(1.18); }
    }

    .app {
      position: relative; z-index: 1;
      width: min(980px, calc(100% - 24px));
      margin: 24px auto;
      background: var(--glass);
      border: 1px solid var(--glass-brd);
      border-radius: 26px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 70px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.09);
      overflow: hidden;
      animation: cardIn .8s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(36px) scale(.95); }
      to { opacity: 1; transform: none; }
    }

    header {
      display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--glass-brd);
    }

    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .4px;
      min-width: 0;
    }
    .brand .logo {
      width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px;
      background: var(--eq-grad); font-size: 19px; color: #fff; box-shadow: 0 4px 16px var(--accent-glow);
      animation: logoPulse 3.2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 4px 16px var(--accent-glow); }
      50% { box-shadow: 0 4px 30px var(--accent2); }
    }
    .brand small {
      display: block; font-size: 10px; font-weight: 500; color: var(--txt-dim); letter-spacing: 1.5px;
    }

    .tabs {
      display: flex; position: relative; margin-left: auto; padding: 4px; border-radius: 999px; background: var(--key);
      border: 1px solid var(--glass-brd); overflow: hidden;
    }
    .tabs button {
      all: unset; cursor: pointer; position: relative; z-index: 1; font-size: 12.5px; font-weight: 700;
      padding: 7px 18px; border-radius: 999px; color: var(--txt-dim); transition: color .25s; white-space: nowrap;
    }
    .tabs button.active { color: #fff; }
    .tab-slider {
      position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 999px; background: var(--eq-grad);
      box-shadow: 0 2px 12px var(--accent-glow); transition: left .35s cubic-bezier(.22,1,.36,1), width .35s cubic-bezier(.22,1,.36,1);
    }

    .icon-btn {
      all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px;
      background: var(--key); border: 1px solid var(--glass-brd); font-size: 15px; transition: background .2s, transform .15s;
    }
    .icon-btn:hover { background: var(--key-hi); transform: translateY(-2px); }
    .icon-btn:active { transform: scale(.92); }

    .view { display: none; padding: 18px 20px 22px; }
    .view.active { display: block; animation: viewIn .45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .calc-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }

    .display {
      background: var(--disp-bg); border: 1px solid var(--glass-brd); border-radius: 18px; min-height: 145px;
      padding: 18px 20px 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative; overflow: hidden;
    }
    .display .expr {
      min-height: 34px; font-size: 19px; overflow-x: auto; white-space: nowrap; text-align: right; scrollbar-width: none;
    }
    .display .expr::-webkit-scrollbar { display: none; }
    .display .result {
      font-size: 26px; overflow-x: auto; white-space: nowrap; text-align: right; color: var(--txt);
      transition: color .3s; scrollbar-width: none;
    }
    .display .result::-webkit-scrollbar { display: none; }
    .display .result.preview { color: var(--txt-dim); }
    .display .result.err { color: var(--danger); }
    .display .result .eq-sign { color: var(--accent2); margin-right: 8px; font-weight: 300; }

    .badge-row { position: absolute; top: 10px; left: 14px; display: flex; gap: 6px; }
    .badge { font-size: 9.5px; font-weight: 800; letter-spacing: 1.2px; color: var(--accent2); opacity: 0; transition: opacity .3s; }
    .badge.show { opacity: 1; }

    .input-row { display: flex; gap: 10px; }
    .input-wrap { flex: 1; position: relative; }
    #mathInput {
      width: 100%; padding: 14px 16px; font-size: 16.5px; color: var(--txt); background: var(--key); border: 1px solid var(--glass-brd);
      border-radius: 14px; outline: none; font-family: "Cambria Math", "Segoe UI", serif; transition: border-color .25s, box-shadow .25s;
    }
    #mathInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    #mathInput::placeholder { color: var(--txt-dim); }

    .btn {
      all: unset; cursor: pointer; text-align: center; border-radius: 14px; background: var(--eq-grad); color: #fff;
      font-weight: 700; font-size: 15px; padding: 0 22px; display: grid; place-items: center; box-shadow: 0 6px 18px var(--accent-glow);
      transition: transform .15s, box-shadow .2s, filter .2s; position: relative; overflow: hidden;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px var(--accent2); filter: brightness(1.08); }
    .btn:active { transform: scale(.95); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      all: unset; cursor: pointer; font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
      background: var(--key); border: 1px solid var(--glass-brd); color: var(--txt-dim); transition: all .2s; position: relative; overflow: hidden;
    }
    .chip:hover { color: var(--txt); background: var(--key-hi); transform: translateY(-1px); border-color: var(--accent); }

    .keypad {
      display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px;
    }
    .keypad button.key {
      all: unset; cursor: pointer; text-align: center; padding: 10px 0; border-radius: 11px; background: var(--key);
      border: 1px solid var(--glass-brd); color: var(--txt); font-size: 14px; font-weight: 600; font-family: "Cambria Math", "Segoe UI", serif;
      transition: background .18s, transform .12s, box-shadow .18s, color .18s; -webkit-tap-highlight-color: transparent;
    }
    .keypad button.key:hover { background: var(--key-hi); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.3); }
    .keypad button.key:active { transform: scale(.9); }
    .keypad button.key.wide { grid-column: span 2; }
    .keypad button.key.fn { color: var(--accent2); font-size: 13px; }
    .keypad button.key.warn { color: var(--danger); }

    .section-label { font-size: 10.5px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--txt-dim); margin: 4px 2px 2px; }

    .history-wrap { margin-top: 4px; }
    .history-list { display: flex; flex-direction: column; gap: 7px; max-height: 210px; overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
    .hist-item {
      display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 12px;
      background: var(--key); border: 1px solid transparent; cursor: pointer; transition: border-color .2s, transform .15s; animation: histIn .35s ease both;
    }
    @keyframes histIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .hist-item:hover { border-color: var(--accent); transform: translateX(4px); }
    .hist-item .h-l { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-item .h-r { font-size: 14px; color: var(--accent2); font-weight: 700; white-space: nowrap; }
    .hist-empty { text-align: center; color: var(--txt-dim); font-size: 13px; padding: 18px; }

    .graph-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
    .fn-panel { display: flex; flex-direction: column; gap: 10px; }
    .fn-list { display: flex; flex-direction: column; gap: 8px; }
    .fn-item {
      display: flex; align-items: center; gap: 8px; background: var(--key); border: 1px solid var(--glass-brd); border-radius: 12px;
      padding: 7px 10px; animation: histIn .3s ease both; transition: border-color .2s, opacity .3s;
    }
    .fn-item.hidden-fn { opacity: .42; }
    .fn-item.err { border-color: var(--danger); }
    .fn-dot { width: 13px; height: 13px; border-radius: 50%; cursor: pointer; flex: none; box-shadow: 0 0 10px currentColor; }
    .fn-item input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--txt); font-size: 14px; font-family: "Cambria Math", "Segoe UI", serif; }
    .fn-del { all: unset; cursor: pointer; color: var(--txt-dim); font-size: 15px; padding: 2px 6px; border-radius: 7px; transition: all .2s; flex: none; }
    .fn-del:hover { color: var(--danger); background: rgba(255,92,124,.12); }

    .graph-tools { display: flex; flex-wrap: wrap; gap: 7px; }
    .tool {
      all: unset; cursor: pointer; font-size: 11.5px; font-weight: 700; padding: 6px 11px; border-radius: 9px; background: var(--key);
      border: 1px solid var(--glass-brd); color: var(--txt-dim); transition: all .2s; position: relative; overflow: hidden;
    }
    .tool:hover { color: var(--txt); background: var(--key-hi); border-color: var(--accent); transform: translateY(-1px); }
    .tool.on { background: var(--eq-grad); color: #fff; border-color: transparent; box-shadow: 0 4px 14px var(--accent-glow); }

    .plot-wrap { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--glass-brd); background: var(--disp-bg); }
    #plotCanvas { display: block; width: 100%; height: 520px; cursor: crosshair; touch-action: none; }
    .plot-readout {
      position: absolute; top: 10px; left: 12px; font-size: 11px; font-weight: 600; color: var(--txt-dim); pointer-events: none; line-height: 1.7;
      background: rgba(0,0,0,.25); padding: 6px 10px; border-radius: 8px; backdrop-filter: blur(4px);
    }
    body.light .plot-readout { background: rgba(255,255,255,.4); }
    .plot-hint {
      position: absolute; bottom: 10px; right: 12px; font-size: 10.5px; color: var(--txt-dim); pointer-events: none; text-align: right; line-height: 1.6;
    }
    .analysis-box { margin-top: 10px; font-size: 12.5px; line-height: 1.9; max-height: 130px; overflow-y: auto; scrollbar-width: thin; }
    .analysis-box .a-tag { font-weight: 800; margin-right: 6px; }
    .analysis-box .a-root { color: var(--danger); font-weight: 700; }
    .analysis-box .a-ext { color: var(--ok); font-weight: 700; }

    @media (max-width: 860px) {
      .graph-grid { grid-template-columns: 1fr; }
      #plotCanvas { height: 380px; }
      .keypad { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .tabs { margin-left: auto; }
      .brand small { display: none; }
    }
  </style>
</head>
<body>
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>

  <div class="app">
    <header>
      <div class="brand">
        <span class="logo">∑</span>
        <div>OmniCalc<small>LATEX &nbsp;·&nbsp; GRAPHS &nbsp;·&nbsp; CAS</small></div>
      </div>

      <nav class="tabs" id="tabs" aria-label="Calculator tabs">
        <div class="tab-slider" id="tabSlider"></div>
        <button data-view="calc" class="active">Calculator</button>
        <button data-view="graph">Graphs</button>
      </nav>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
    </header>

    <section class="view active" id="view-calc">
      <div class="calc-grid">
        <div class="display">
          <div class="badge-row"><span class="badge" id="angleBadge">DEG</span></div>
          <div class="expr" id="exprView"></div>
          <div class="result preview" id="resView"><span class="eq-sign">=</span>0</div>
        </div>

        <div class="input-row">
          <div class="input-wrap">
            <input id="mathInput" spellcheck="false" autocomplete="off" placeholder="Type math or LaTeX — e.g. \frac{sin(x)}{x^2}, 5 km to miles, [1,2;3,4]·[5;6]" />
          </div>
          <button class="btn" id="evalBtn" title="Evaluate (Enter)">=</button>
        </div>

        <div class="chips" id="smartChips">
          <button class="chip" data-op="simplify">✨ Simplify</button>
          <button class="chip" data-op="derive">∂/∂x Differentiate</button>
          <button class="chip" data-op="graphit">📈 Graph f(x)</button>
          <button class="chip" data-op="deg">DEG trig</button>
          <button class="chip" data-op="rad">RAD trig</button>
          <button class="chip" data-ex="\frac{1}{2}+\sqrt{16}">ex: ½+√16</button>
          <button class="chip" data-ex="2\pi + e^{2}">ex: 2π+e²</button>
          <button class="chip" data-ex="5 kg \cdot 9.81 m/s^2 to lbf">ex: units</button>
          <button class="chip" data-ex="[1,2;3,4] \cdot [5;6]">ex: matrix</button>
          <button class="chip" data-ex="sqrt(-1)^2 + (3+4i)(1-2i)">ex: complex</button>
        </div>

        <div class="section-label">Keys — insert LaTeX at cursor</div>
        <div class="keypad" id="keypad">
          <button class="key" data-ins="7">7</button><button class="key" data-ins="8">8</button><button class="key" data-ins="9">9</button>
          <button class="key" data-ins="(">(</button><button class="key" data-ins=")">)</button>
          <button class="key fn" data-latex="\frac{}{}" data-caret="3">a/b</button>
          <button class="key fn" data-latex="\sqrt{}" data-caret="1">√x</button>
          <button class="key fn" data-latex="^{}" data-caret="1">xⁿ</button>
          <button class="key fn" data-latex="\left|\right|" data-caret="7">|x|</button>
          <button class="key warn" data-act="clear">AC</button>

          <button class="key" data-ins="4">4</button><button class="key" data-ins="5">5</button><button class="key" data-ins="6">6</button>
          <button class="key" data-ins="+">+</button><button class="key" data-ins="-">−</button>
          <button class="key fn" data-latex="\pi">π</button>
          <button class="key fn" data-latex="e">e</button>
          <button class="key fn" data-ins="!">n!</button>
          <button class="key fn" data-ins="%">%</button>
          <button class="key warn" data-act="backspace">⌫</button>

          <button class="key" data-ins="1">1</button><button class="key" data-ins="2">2</button><button class="key" data-ins="3">3</button>
          <button class="key" data-ins="*">×</button><button class="key" data-ins="/">÷</button>
          <button class="key fn" data-latex="\ln{}" data-caret="1">ln</button>
          <button class="key fn" data-latex="\log{}" data-caret="1">log</button>
          <button class="key fn" data-latex="\sin{}" data-caret="1">sin</button>
          <button class="key fn" data-latex="\cos{}" data-caret="1">cos</button>
          <button class="key fn" data-latex="\tan{}" data-caret="1">tan</button>

          <button class="key" data-ins="0">0</button><button class="key" data-ins=".">.</button>
          <button class="key" data-ins=",">,</button><button class="key" data-ins="^">^</button>
          <button class="key fn" data-latex="\sum_{}^{}" data-caret="6">Σ</button>
          <button class="key fn" data-latex="\int_{}^{}" data-caret="6">∫</button>
          <button class="key fn" data-latex="\lim_{}" data-caret="5">lim</button>
          <button class="key fn" data-latex="\sqrt[3]{}" data-caret="1">∛x</button>
          <button class="key fn" data-latex="\infty">∞</button>
          <button class="key fn" data-latex="\theta">θ</button>
        </div>

        <div class="section-label">History — click to reuse</div>
        <div class="history-wrap">
          <div class="history-list" id="historyList">
            <div class="hist-empty">Your calculations will appear here…</div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-graph">
      <div class="graph-grid">
        <div class="fn-panel">
          <div class="section-label">Functions of x — LaTeX or plain</div>
          <div class="fn-list" id="fnList"></div>
          <button class="chip" id="addFnBtn" style="text-align:center; padding:9px;">+ Add function</button>

          <div class="section-label">Presets</div>
          <div class="chips">
            <button class="chip" data-fn="\sin(x)/x">sin(x)/x</button>
            <button class="chip" data-fn="x^3-3x">x³−3x</button>
            <button class="chip" data-fn="e^{-x^2}">gaussian</button>
            <button class="chip" data-fn="\frac{1}{x}">1/x</button>
            <button class="chip" data-fn="\ln(x)">ln(x)</button>
            <button class="chip" data-fn="\sin(x)+\cos(3x)">wave mix</button>
          </div>

          <div class="section-label">Tools</div>
          <div class="graph-tools">
            <button class="tool" id="zoomIn">＋ Zoom</button>
            <button class="tool" id="zoomOut">－ Zoom</button>
            <button class="tool" id="resetView">⟲ Reset</button>
            <button class="tool" id="toggleGrid">▦ Grid</button>
            <button class="tool" id="analyzeBtn">🔍 Roots & extrema</button>
            <button class="tool" id="pngBtn">⬇ PNG</button>
          </div>

          <div class="analysis-box" id="analysisBox" hidden></div>
        </div>

        <div class="plot-wrap">
          <canvas id="plotCanvas"></canvas>
          <div class="plot-readout" id="plotReadout"></div>
          <div class="plot-hint">drag to pan · scroll to zoom · pinch on touch<br>hover to trace values</div>
        </div>
      </div>
    </section>
  </div>

  <script>
  (function () {
    "use strict";

    const input = document.getElementById('mathInput');
    const exprView = document.getElementById('exprView');
    const resView = document.getElementById('resView');
    const evalBtn = document.getElementById('evalBtn');
    const historyList = document.getElementById('historyList');
    const angleBadge = document.getElementById('angleBadge');
    const tabs = document.querySelectorAll('.tabs button[data-view]');
    const views = { calc: document.getElementById('view-calc'), graph: document.getElementById('view-graph') };
    const tabSlider = document.getElementById('tabSlider');
    const themeBtn = document.getElementById('themeBtn');

    let degMode = true;
    let history = JSON.parse(localStorage.getItem('omni_calc_history') || '[]');
    let graphState = {
      zoom: 1,
      offsetX: 0,
      offsetY: 0,
      showGrid: true,
      dragging: false,
      dragStartX: 0,
      dragStartY: 0,
      startOffsetX: 0,
      startOffsetY: 0,
      lastPointer: null,
      functions: [
        { id: crypto.randomUUID(), expr: 'sin(x)', color: '#7c5cff', hidden: false },
        { id: crypto.randomUUID(), expr: 'cos(x)', color: '#00e5ff', hidden: false }
      ]
    };

    function renderTabSlider() {
      const active = document.querySelector('.tabs button.active');
      if (!active || !tabSlider) return;
      const parentRect = active.parentElement.getBoundingClientRect();
      const rect = active.getBoundingClientRect();
      tabSlider.style.width = `${rect.width}px`;
      tabSlider.style.left = `${rect.left - parentRect.left}px`;
    }

    function setView(name) {
      tabs.forEach((btn) => {
        const active = btn.dataset.view === name;
        btn.classList.toggle('active', active);
      });
      Object.entries(views).forEach(([key, el]) => {
        el.classList.toggle('active', key === name);
      });
      renderTabSlider();
    }

    tabs.forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light');
      themeBtn.textContent = document.body.classList.contains('light') ? '☀' : '☾';
    });

    function sanitizeHistory() {
      history = history.filter(Boolean).slice(0, 12);
      localStorage.setItem('omni_calc_history', JSON.stringify(history));
    }

    function humanText(value) {
      if (typeof value === 'number' && Number.isFinite(value)) return Number(value.toFixed(12)).toString();
      return String(value ?? '');
    }

    function renderMath(el, text) {
      el.innerHTML = '';
      if (!text) { el.textContent = '0'; return; }
      try {
        katex.render(String(text), el, { throwOnError: false, displayMode: false, output: 'htmlAndMathml' });
      } catch (error) {
        el.textContent = text;
      }
    }

    function updateExpressionPreview(value) {
      const safe = value && String(value).trim() ? String(value).trim() : '0';
      const exprHtml = safe === '0' ? '0' : safe;
      renderMath(exprView, exprHtml);
    }

    function setResultDisplay(value, error = false) {
      resView.classList.toggle('err', error);
      if (error) {
        resView.innerHTML = `<span class="eq-sign">=</span>${String(value)}`;
        return;
      }
      const text = humanText(value);
      resView.innerHTML = `<span class="eq-sign">=</span>${text}`;
    }

    function latexToMath(raw) {
      let s = String(raw == null ? '' : raw).trim();
      if (!s) return '0';
      s = s.replace(/\$\$?/g, '')
        .replace(/\\left|\\right/g, '')
        .replace(/\\,|\\;|\\!|\\:|\\quad|\\qquad|~/g, ' ')
        .replace(/\\ /g, ' ')
        .replace(/\\text\s*\{([^{}]*)\}/g, '$1')
        .replace(/\\\|([^|]+)\\\|/g, 'abs($1)')
        .replace(/\|([^|]+)\|/g, 'abs($1)');

      s = s.replace(/\\sqrt\s*\[([^\[\]]+)\]\s*\{([^{}]*)\}/g, 'nthRoot($2, $1)')
           .replace(/\\sqrt\s*\{([^{}]*)\}/g, 'sqrt($1)')
           .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '(($1)/($2))');

      let guard = 0;
      while (/\^\s*\{[^{}]*\}/.test(s) && guard++ < 60) s = s.replace(/\^\s*\{([^{}]*)\}/g, '^($1)');
      guard = 0;
      while (/(?:^|[^A-Za-z])\w+_\{[^{}]*\}/.test(s) && guard++ < 60) s = s.replace(/([A-Za-z0-9]+)_\{([^{}]*)\}/g, '$1_$2');

      const FN = {
        arcsin: 'asin', arccos: 'acos', arctan: 'atan',
        sinh: 'sinh', cosh: 'cosh', tanh: 'tanh',
        sec: 'sec', csc: 'csc', cot: 'cot',
        sin: 'sin', cos: 'cos', tan: 'tan',
        exp: 'exp', ln: 'log', log: 'log10',
        abs: 'abs', min: 'min', max: 'max', gcd: 'gcd', lcm: 'lcm', mod: 'mod',
        asin: 'asin', acos: 'acos', atan: 'atan'
      };
      Object.keys(FN).sort((a, b) => b.length - a.length).forEach((k) => {
        s = s.replace(new RegExp('\\\\' + k + '(?![a-zA-Z])', 'g'), FN[k]);
      });

      s = s.replace(/\\times|\\cdot/g, '*')
        .replace(/\\div/g, '/')
        .replace(/\\pm/g, '+')
        .replace(/\\pi(?![a-zA-Z])/g, ' pi ')
        .replace(/\\infty/g, ' Infinity ')
        .replace(/\\e(?![a-zA-Z])/g, ' e ')
        .replace(/\\theta/g, ' theta ')
        .replace(/\\circ/g, '');

      s = s.replace(/_\s*\{([^{}]*)\}/g, '_$1')
        .replace(/\\[a-zA-Z]+/g, ' ')
        .replace(/\{/g, '(')
        .replace(/\}/g, ')');

      s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
        .replace(/·/g, '*').replace(/π/g, 'pi').replace(/√/g, 'sqrt')
        .replace(/²/g, '^2').replace(/³/g, '^3').replace(/∞/g, 'Infinity')
        .replace(/≈/g, '==').replace(/θ/g, 'theta');

      s = s.replace(/\s+/g, ' ').trim();
      if (!s) return '0';
      return s;
    }

    function normalizeExpression(inputValue) {
      let s = String(inputValue ?? '').trim();
      if (!s) return '0';
      s = latexToMath(s);
      return s;
    }

    function evaluateExpression(expression) {
      const safe = normalizeExpression(expression);
      try {
        const compiled = math.compile(safe);
        const value = compiled.evaluate({
          x: 0,
          e: Math.E,
          pi: Math.PI,
          theta: 0,
          Infinity: Infinity
        });
        return value;
      } catch (error) {
        throw new Error(error.message || 'Invalid expression');
      }
    }

    function evaluateCurrent() {
      const raw = input.value;
      const mathExpr = normalizeExpression(raw);
      updateExpressionPreview(mathExpr);
      try {
        const parsed = math.compile(mathExpr);
        const value = parsed.evaluate({
          x: 0,
          e: Math.E,
          pi: Math.PI,
          theta: 0,
          Infinity: Infinity
        });
        setResultDisplay(value, false);
        addHistory(raw, humanText(value));
        return value;
      } catch (error) {
        setResultDisplay(error.message || 'Error', true);
        return null;
      }
    }

    function addHistory(expr, result) {
      const text = (expr || '').trim();
      if (!text) return;
      history.unshift({ expr: text, result });
      history = history.filter((item, index, arr) => arr.findIndex((it) => it.expr === item.expr && it.result === item.result) === index);
      sanitizeHistory();
      renderHistory();
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = '<div class="hist-empty">Your calculations will appear here…</div>';
        return;
      }
      historyList.innerHTML = history.map((entry) => `
        <div class="hist-item" data-expr="${encodeURIComponent(entry.expr)}">
          <div class="h-l">${entry.expr}</div>
          <div class="h-r">${entry.result}</div>
        </div>
      `).join('');
      historyList.querySelectorAll('.hist-item').forEach((item) => {
        item.addEventListener('click', () => {
          const expr = decodeURIComponent(item.dataset.expr || '');
          input.value = expr;
          input.focus();
          evaluateCurrent();
        });
      });
    }

    function insertAtCursor(text, caretOffset = 0) {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const before = input.value.slice(0, start);
      const after = input.value.slice(end);
      input.value = before + text + after;
      const pos = start + text.length - (caretOffset || 0);
      input.focus();
      input.setSelectionRange(pos, pos);
    }

    function bindKeypad() {
      document.querySelectorAll('.key').forEach((key) => {
        key.addEventListener('click', () => {
          const latex = key.dataset.latex;
          const ins = key.dataset.ins;
          const act = key.dataset.act;
          if (act === 'clear') {
            input.value = '';
            updateExpressionPreview('0');
            setResultDisplay('0', false);
            input.focus();
            return;
          }
          if (act === 'backspace') {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            if (start === end && start > 0) {
              input.value = input.value.slice(0, start - 1) + input.value.slice(end);
              input.focus();
              input.setSelectionRange(start - 1, start - 1);
            } else {
              input.value = input.value.slice(0, start) + input.value.slice(end);
              input.focus();
              input.setSelectionRange(start, start);
            }
            return;
          }
          if (latex) {
            const caret = Number(key.dataset.caret || 0);
            const text = latex;
            insertAtCursor(text, caret);
            return;
          }
          if (ins !== undefined) {
            insertAtCursor(ins, 0);
          }
        });
      });
    }

    function configureSmartChips() {
      document.querySelectorAll('.chip[data-ex]').forEach((chip) => {
        chip.addEventListener('click', () => {
          input.value = chip.dataset.ex;
          input.focus();
          evaluateCurrent();
        });
      });
      document.querySelectorAll('.chip[data-op]').forEach((chip) => {
        chip.addEventListener('click', () => {
          const expr = input.value.trim() || 'x';
          const fn = chip.dataset.op;
          if (fn === 'simplify') input.value = `simplify(${normalizeExpression(expr)})`;
          if (fn === 'derive') input.value = `diff(${normalizeExpression(expr)}, x)`;
          if (fn === 'graphit') {
            const graphInput = normalizeExpression(expr);
            addFunction(graphInput, true);
            setView('graph');
            return;
          }
          if (fn === 'deg') {
            degMode = true;
            angleBadge.textContent = 'DEG';
            angleBadge.classList.add('show');
            input.value = expr;
          }
          if (fn === 'rad') {
            degMode = false;
            angleBadge.textContent = 'RAD';
            angleBadge.classList.add('show');
            input.value = expr;
          }
          evaluateCurrent();
        });
      });
    }

    function addFunction(expr, focusGraph = false) {
      const safe = normalizeExpression(expr || 'sin(x)');
      graphState.functions.push({ id: crypto.randomUUID(), expr: safe, color: randomColor(), hidden: false });
      renderFunctionList();
      if (focusGraph) drawGraph();
    }

    function randomColor() {
      const palette = ['#7c5cff', '#00e5ff', '#3ddc97', '#ff5c7c', '#ffd166', '#f472b6'];
      return palette[Math.floor(Math.random() * palette.length)];
    }

    function renderFunctionList() {
      const fnList = document.getElementById('fnList');
      if (!fnList) return;
      fnList.innerHTML = graphState.functions.map((item) => `
        <div class="fn-item ${item.hidden ? 'hidden-fn' : ''}" data-id="${item.id}" style="border-color:${item.color}99;">
          <span class="fn-dot" style="background:${item.color}; color:${item.color};" title="Toggle visibility"></span>
          <input type="text" value="${escapeHtml(item.expr)}" aria-label="Function ${item.expr}" />
          <button class="fn-del" aria-label="Remove function">×</button>
        </div>
      `).join('');

      fnList.querySelectorAll('.fn-item').forEach((row) => {
        const id = row.dataset.id;
        const inputEl = row.querySelector('input');
        const dot = row.querySelector('.fn-dot');
        const removeBtn = row.querySelector('.fn-del');

        dot.addEventListener('click', () => {
          const fn = graphState.functions.find((item) => item.id === id);
          if (fn) fn.hidden = !fn.hidden;
          renderFunctionList();
          drawGraph();
        });

        removeBtn.addEventListener('click', () => {
          graphState.functions = graphState.functions.filter((item) => item.id !== id);
          if (!graphState.functions.length) addFunction('sin(x)');
          renderFunctionList();
          drawGraph();
        });

        inputEl.addEventListener('input', () => {
          const fn = graphState.functions.find((item) => item.id === id);
          if (fn) fn.expr = normalizeExpression(inputEl.value || 'x');
          drawGraph();
        });
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function initGraph() {
      const canvas = document.getElementById('plotCanvas');
      const ctx = canvas.getContext('2d');
      const plotReadout = document.getElementById('plotReadout');
      const resetView = document.getElementById('resetView');
      const zoomIn = document.getElementById('zoomIn');
      const zoomOut = document.getElementById('zoomOut');
      const toggleGrid = document.getElementById('toggleGrid');
      const addFnBtn = document.getElementById('addFnBtn');
      const analyzeBtn = document.getElementById('analyzeBtn');
      const pngBtn = document.getElementById('pngBtn');

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        drawGraph();
      }

      function graphRange() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        return {
          xMin: (-10 / graphState.zoom) - graphState.offsetX,
          xMax: (10 / graphState.zoom) - graphState.offsetX,
          yMin: (-6 / graphState.zoom) - graphState.offsetY,
          yMax: (6 / graphState.zoom) - graphState.offsetY,
          width,
          height
        };
      }

      function mapToCanvas(x, y, range) {
        const px = ((x - range.xMin) / (range.xMax - range.xMin)) * range.width;
        const py = range.height - ((y - range.yMin) / (range.yMax - range.yMin)) * range.height;
        return { x: px, y: py };
      }

      function drawGraph() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        ctx.clearRect(0, 0, width, height);
        const range = graphRange();

        if (graphState.showGrid) {
          ctx.strokeStyle = 'rgba(255,255,255,0.07)';
          ctx.lineWidth = 1;
          for (let x = Math.ceil(range.xMin); x <= Math.floor(range.xMax); x += 1) {
            const p = mapToCanvas(x, 0, range);
            ctx.beginPath();
            ctx.moveTo(p.x, 0);
            ctx.lineTo(p.x, height);
            ctx.stroke();
          }
          for (let y = Math.ceil(range.yMin); y <= Math.floor(range.yMax); y += 1) {
            const p = mapToCanvas(0, y, range);
            ctx.beginPath();
            ctx.moveTo(0, p.y);
            ctx.lineTo(width, p.y);
            ctx.stroke();
          }
        }

        const axisY = mapToCanvas(0, 0, range);
        const axisX = mapToCanvas(0, 0, range);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, axisY.y); ctx.lineTo(width, axisY.y); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(axisX.x, 0); ctx.lineTo(axisX.x, height); ctx.stroke();

        graphState.functions.forEach((fn) => {
          if (fn.hidden) return;
          try {
            const compiled = math.compile(normalizeExpression(fn.expr));
            ctx.beginPath();
            let started = false;
            for (let px = 0; px <= width; px += 2) {
              const x = ((px / width) * (range.xMax - range.xMin)) + range.xMin;
              const y = compiled.evaluate({ x, e: Math.E, pi: Math.PI, theta: 0, Infinity: Infinity });
              if (!Number.isFinite(y)) continue;
              const mapped = mapToCanvas(x, y, range);
              if (!started) { ctx.moveTo(mapped.x, mapped.y); started = true; }
              else { ctx.lineTo(mapped.x, mapped.y); }
            }
            ctx.strokeStyle = fn.color;
            ctx.lineWidth = 2.2;
            ctx.stroke();
          } catch (error) {
            // no-op for invalid graph expressions
          }
        });

        plotReadout.textContent = `zoom ${graphState.zoom.toFixed(2)} · x range ${range.xMin.toFixed(2)} to ${range.xMax.toFixed(2)}`;
      }

      canvas.addEventListener('pointerdown', (event) => {
        graphState.dragging = true;
        graphState.dragStartX = event.clientX;
        graphState.dragStartY = event.clientY;
        graphState.startOffsetX = graphState.offsetX;
        graphState.startOffsetY = graphState.offsetY;
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const cx = event.clientX - rect.left;
        const cy = event.clientY - rect.top;
        const range = graphRange();
        const x = ((cx / rect.width) * (range.xMax - range.xMin)) + range.xMin;
        const y = ((1 - cy / rect.height) * (range.yMax - range.yMin)) + range.yMin;
        plotReadout.textContent = `x = ${x.toFixed(3)} · y = ${y.toFixed(3)} · zoom ${graphState.zoom.toFixed(2)}`;
        if (!graphState.dragging) return;
        const dx = (event.clientX - graphState.dragStartX) / rect.width;
        const dy = (event.clientY - graphState.dragStartY) / rect.height;
        graphState.offsetX = graphState.startOffsetX - dx * (range.xMax - range.xMin);
        graphState.offsetY = graphState.startOffsetY + dy * (range.yMax - range.yMin);
        drawGraph();
      });

      canvas.addEventListener('pointerup', () => { graphState.dragging = false; });
      canvas.addEventListener('pointerleave', () => { graphState.dragging = false; });
      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const delta = event.deltaY < 0 ? 1.15 : 0.85;
        graphState.zoom = Math.min(8, Math.max(0.35, graphState.zoom * delta));
        drawGraph();
      }, { passive: false });

      resetView.addEventListener('click', () => {
        graphState.zoom = 1; graphState.offsetX = 0; graphState.offsetY = 0; drawGraph();
      });
      zoomIn.addEventListener('click', () => { graphState.zoom = Math.min(8, graphState.zoom * 1.2); drawGraph(); });
      zoomOut.addEventListener('click', () => { graphState.zoom = Math.max(0.35, graphState.zoom / 1.2); drawGraph(); });
      toggleGrid.addEventListener('click', () => { graphState.showGrid = !graphState.showGrid; toggleGrid.classList.toggle('on', graphState.showGrid); drawGraph(); });
      addFnBtn.addEventListener('click', () => addFunction('x^2'));

      analyzeBtn.addEventListener('click', () => {
        const box = document.getElementById('analysisBox');
        let text = '';
        graphState.functions.forEach((fn, index) => {
          if (fn.hidden) return;
          try {
            const compiled = math.compile(normalizeExpression(fn.expr));
            const sample = [];
            for (let x = -10; x <= 10; x += 0.25) {
              const y = compiled.evaluate({ x, e: Math.E, pi: Math.PI, theta: 0, Infinity: Infinity });
              if (Number.isFinite(y)) sample.push({ x, y });
            }
            let roots = [], extrema = [];
            for (let i = 1; i < sample.length - 1; i++) {
              if (Math.abs(sample[i].y) < 1e-3) roots.push(sample[i].x);
              if ((sample[i].y - sample[i - 1].y) * (sample[i + 1].y - sample[i].y) < 0) extrema.push(sample[i].x);
            }
            const label = `f${index + 1}(x) = ${fn.expr}`;
            text += `<div><span class="a-tag">${label}</span><span class="a-root">roots</span> ${roots.slice(0, 5).map((n) => n.toFixed(2)).join(', ') || 'none'} · <span class="a-ext">extrema</span> ${extrema.slice(0, 5).map((n) => n.toFixed(2)).join(', ') || 'none'}</div>`;
          } catch (error) {
            text += `<div><span class="a-tag">${fn.expr}</span> invalid for graph analysis</div>`;
          }
        });
        box.hidden = false;
        box.innerHTML = text || '<div class="a-tag">No valid functions</div>';
      });

      pngBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'omni-calc-graph.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      toggleGrid.classList.toggle('on', graphState.showGrid);
      renderFunctionList();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      drawGraph();
    }

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        evaluateCurrent();
        return;
      }
      if (event.key === 'Escape') {
        input.value = '';
        setResultDisplay('0', false);
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'l') {
        event.preventDefault(); input.focus();
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault(); input.value = ''; updateExpressionPreview('0'); setResultDisplay('0', false);
      }
    });

    function init() {
      renderHistory();
      bindKeypad();
      configureSmartChips();
      evalBtn.addEventListener('click', evaluateCurrent);
      setView('calc');
      renderTabSlider();
      angleBadge.classList.add('show');
      updateExpressionPreview('0');
      setResultDisplay('0', false);
      initGraph();
      input.value = 'sin(x) + cos(x)';
      evaluateCurrent();
    }

    window.addEventListener('resize', renderTabSlider);
    init();
  })();
  </script>
</body>
</html>
